<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Rounded black container with 100% transparent corners outside -->
  <rect width="100" height="100" rx="26" fill="#000000" />
  
  <!-- Off-white / cream chevron pointing left -->
  <path 
    d="M 70 27 L 33 50 L 70 73" 
    stroke="#F3EFE9" 
    stroke-width="12.5" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />
  
  <!-- Pink chevron pointing right (layered over cream) -->
  <path 
    d="M 30 27 L 67 50 L 30 73" 
    stroke="#FF95A0" 
    stroke-width="12.5" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />
</svg>
